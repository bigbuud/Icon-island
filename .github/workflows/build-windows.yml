name: Build Windows installer

# Bouwt IconIsland-<versie>-win-x64-Setup.exe op een Windows-server van GitHub
# en zet hem onder "Releases" (tag "latest"). Start automatisch bij elke push naar main,
# of handmatig via Actions -> "Build Windows installer" -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Number this build (0.2.<run>) so the program can see newer builds
        shell: powershell
        run: |
          $v = Get-Content tools\version.json -Raw | ConvertFrom-Json
          $parts = $v.version.Split('.')
          $new = '{0}.{1}.{2}' -f $parts[0], $parts[1], $env:GITHUB_RUN_NUMBER
          [IO.File]::WriteAllText('tools\version.json', '{"version":"' + $new + '"}')
          Write-Host "Version $new"

      - name: Install NSIS (installer maker)
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\build-installer.ps1 -NsisCompiler "C:\Program Files (x86)\NSIS\makensis.exe"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconIsland-Setup
          path: |
            dist/IconIsland-*-Setup.exe
            dist/IconIsland-*-Setup.exe.sha256

      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/IconIsland-*-Setup.exe dist/IconIsland-*-Setup.exe.sha256 \
            --title "Icon Island (latest build)" \
            --notes "Automatische build van commit ${GITHUB_SHA::7}. Download het Setup.exe-bestand hieronder. De installer is niet ondertekend: Windows SmartScreen kan een waarschuwing tonen (Meer info > Toch uitvoeren)."
