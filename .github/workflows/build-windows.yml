name: Build Windows installer

# Bouwt IconIsland-<versie>-win-x64-Setup.exe op een Windows-server van GitHub
# en zet hem onder "Releases" (tag "latest"). Start automatisch bij elke push naar main,
# of handmatig via Actions -> "Build Windows installer" -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Number this build (0.2.<run>) so the program can see newer builds
        shell: powershell
        run: |
          $v = Get-Content tools\version.json -Raw | ConvertFrom-Json
          $parts = $v.version.Split('.')
          $new = '{0}.{1}.{2}' -f $parts[0], $parts[1], $env:GITHUB_RUN_NUMBER
          [IO.File]::WriteAllText('tools\version.json', '{"version":"' + $new + '"}')
          Write-Host "Version $new"

      - name: Install NSIS (installer maker)
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\build-installer.ps1 -NsisCompiler "C:\Program Files (x86)\NSIS\makensis.exe"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconIsland-Setup
          path: |
            dist/IconIsland-*-Setup.exe
            dist/IconIsland-*-Setup.exe.sha256

      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTALLER=$(ls dist/IconIsland-*-Setup.exe | head -n 1)
          NAME=$(basename "$INSTALLER")
          HASH=$(sha256sum "$INSTALLER" | cut -d' ' -f1)
          cat > release-notes.md <<EOF
          Automatic build of commit \`${GITHUB_SHA::7}\`. Download \`${NAME}\` below and run it.

          ### Windows SmartScreen warning
          This installer is **not code-signed** (a signing certificate costs money and Icon Island is a free project), so Windows SmartScreen may show "Windows protected your PC". That is expected for new, unsigned software. To continue, click **More info** and then **Run anyway**.

          ### Verify your download
          SHA-256 of \`${NAME}\`:

          \`\`\`
          ${HASH}
          \`\`\`

          Check it in PowerShell (the \`Hash\` value must match):

          \`\`\`powershell
          Get-FileHash .\\${NAME} -Algorithm SHA256
          \`\`\`

          The same checksum is available as \`${NAME}.sha256\`. More details in the [README](https://github.com/${GITHUB_REPOSITORY}#download-and-install).
          EOF
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$INSTALLER" "$INSTALLER.sha256" \
            --title "Icon Island (latest build)" \
            --notes-file release-notes.md
